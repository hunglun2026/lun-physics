name: deploy physics-explorer

# 普通物理（physics.hunglun.com）：Worker＋靜態網頁，push main 就自動部署。沒有資料庫。
# 原始碼真正的家在 ClaudeOnly 的 school/lun-physics/，由 scripts/publish-public.sh 同步上來。public/ 是 scripts/build.py 的產出，已一併提交。
# Actions secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID（hunglun2026）。Worker 執行期密鑰 NTFY_TOPIC 另外設定。

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-physics-explorer
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝相依套件
        run: npm ci
      - name: 內容驗算（每題答案用獨立公式再算一次）
        run: npm test
      - name: 確認 public/ 與原始內容一致（有人改了內容卻沒重新建置就擋下）
        run: |
          python -X utf8 scripts/build.py
          git diff --exit-code -- public
      - name: 型別檢查
        run: npx tsc
      - name: 部署到 Cloudflare（hunglun2026）
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
